<script>

/* ===== 初期 ===== */
const themeColor = getComputedStyle(document.documentElement).getPropertyValue("--app-theme-color").trim();
if (themeColor) document.querySelector('meta[name="theme-color"]').content = themeColor;

let data = [];
let keyword = "";
let filterOpen = true;
const SAVE_LIMIT = 50;
const SAVE_WARNING = 48;
const searchInput = document.getElementById("search");
const googleSearch = document.getElementById("googleSearch");
const examDates = document.querySelectorAll(".exam_countdown time");
const tokyoDate = new Intl.DateTimeFormat("en-CA", {
  timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit"
});

let countdownDay;
function updateCountdown(now = new Date()) {
  const parts = Object.fromEntries(tokyoDate.formatToParts(now).map(({type, value}) => [type, value]));
  const today = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day));
  if (today === countdownDay) return;
  countdownDay = today;
  examDates.forEach(el => {
    const days = (Date.parse(el.dateTime) - today) / 86400000;
    el.classList.toggle("exam_countdown_date", days <= 0);
    el.textContent = days > 0 ? String(days) : days === 0 ? "当日" : "終了";
    if (days > 0) {
      const unit = document.createElement("small");
      unit.textContent = "日";
      el.appendChild(unit);
    }
  });
}

updateCountdown();
setInterval(updateCountdown, 1000);
const header = document.querySelector(".app_header");
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(() => {
    document.documentElement.style.setProperty("--app-header-height", header.offsetHeight + "px");
  }).observe(header);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateCountdown();
});

function updateGoogleSearch(){
  googleSearch.disabled = !searchInput.value.trim();
}

googleSearch.addEventListener("click", () => {
  const query = searchInput.value.trim();
  if (!query) return;
  void copyText(query);
  const params = new URLSearchParams({q: query});
  window.open(`https://www.google.com/search?${params}`, "_blank", "noopener,noreferrer");
});
window.addEventListener("pageshow", updateGoogleSearch);
window.addEventListener("load", ()=>{

  data = window.wordData || [];

  runSearch();

});
const results = document.getElementById("results");
const myResults = document.getElementById("myResults");

/* ===== ダークモード ===== */
const darkSwitch = document.getElementById("darkSwitch");

if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark");
  darkSwitch.checked = true;
}

darkSwitch.addEventListener("change", () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", darkSwitch.checked);
});
function saveOrder(){
  const order = Array.from(document.querySelectorAll("#filters input"))
    .map(x => x.value);

  localStorage.setItem("filterOrder", JSON.stringify(order));
}
function loadOrder(){
  try{
    const saved = JSON.parse(localStorage.getItem("filterOrder"));
    if(!saved) return;

    const container = document.getElementById("filters");
    const items = Array.from(container.children);

    saved.forEach(val=>{
      const target = items.find(item =>
        item.querySelector("input").value === val
      );
      if(target){
        container.appendChild(target);
      }
    });

  }catch{}
}
function moveUp(btn){
  const item = btn.closest(".filter_item");
  const prev = item.previousElementSibling;
  if(prev){
    item.parentNode.insertBefore(item, prev);
    runSearch();
    saveOrder();
  }
}

function moveDown(btn){
  const item = btn.closest(".filter_item");
  const next = item.nextElementSibling;
  if(next){
    item.parentNode.insertBefore(next, item);
    runSearch();
    saveOrder();
  }
}
/* ===== フィルタ開閉 ===== */
function toggleFilter(){
  const el = document.getElementById("filters");
  const icon = document.getElementById("filterIcon");

  filterOpen = !filterOpen;

  el.classList.toggle("filter_list_closed", !filterOpen);
  icon.textContent = filterOpen ? "▼" : "▲";

  localStorage.setItem("filterOpen", filterOpen);
}
function resetSearch(){

  keyword = "";

  searchInput.value = "";
  updateGoogleSearch();

  results.innerHTML = "";

}
function loadFilterOpen(){
  const saved = localStorage.getItem("filterOpen");
  if(saved === null) return;

  filterOpen = (saved === "true");

  const el = document.getElementById("filters");
  const icon = document.getElementById("filterIcon");

  el.classList.toggle("filter_list_closed", !filterOpen);
  icon.textContent = filterOpen ? "▼" : "▲";
}

/* ===== 単語帳カラー ===== */
function getBookClass(book) {
  const map = {
    "ユメタン1": "book_yumetan1",
    "ユメタン2": "book_yumetan2",
    "鉄壁": "book_teppeki",
    "超鉄壁": "book_choteppeki",
    "LEAP": "book_leap",
    "システム英単語": "book_system",
    "ターゲット1900": "book_target1900",
  };
  return map[book] || "";
}

/* ===== 検索 ===== */
searchInput.addEventListener("input", ()=>{
  keyword = searchInput.value.trim().toLowerCase();
  updateGoogleSearch();
  runSearch();
});

/* ===== フィルタ状態保存 ===== */
document.querySelectorAll("#filters input").forEach(cb=>{
  cb.addEventListener("change", ()=>{
    saveFilterState();
    runSearch();
  });
});

function saveFilterState(){
  const states = {};
  document.querySelectorAll("#filters input").forEach(cb=>{
    states[cb.value] = cb.checked;
  });
  localStorage.setItem("filterChecked", JSON.stringify(states));
}

function loadFilterState(){
  try{
    const saved = JSON.parse(localStorage.getItem("filterChecked"));
    if(!saved) return;

    document.querySelectorAll("#filters input").forEach(cb=>{
      if(saved[cb.value] !== undefined){
        cb.checked = saved[cb.value];
      }
    });
  }catch{}
}

/* ===== 英語判定 ===== */
function isEnglish(text) {
  return /^[a-zA-Z\s\-']+$/.test(text);
}

/* ===== 検索処理 ===== */
function runSearch(){
  if (!keyword) {
    results.innerHTML = "";
    return;
  }

  const checked = Array.from(document.querySelectorAll("#filters input:checked"))
    .map(x => x.value);

  const order = Array.from(document.querySelectorAll("#filters input"))
    .map(x => x.value);

  const isEng = isEnglish(keyword);

  let list = data.filter(x=>{
    if (!checked.includes(x.book)) return false;

    if (isEng) {
      return x.word.toLowerCase().includes(keyword);
    } else {
      return x.meaning && x.meaning.toLowerCase().includes(keyword);
    }
  });

  list.sort((a,b)=>{
    const aOrder = order.indexOf(a.book);
    const bOrder = order.indexOf(b.book);
    if (aOrder !== bOrder) return aOrder - bOrder;

    const aWord = a.word.toLowerCase();
    const bWord = b.word.toLowerCase();

    const aExact = aWord === keyword;
    const bExact = bWord === keyword;
    if (aExact !== bExact) return bExact - aExact;

    const aStart = aWord.startsWith(keyword);
    const bStart = bWord.startsWith(keyword);
    if (aStart !== bStart) return bStart - aStart;

    if (aWord.length !== bWord.length) {
      return aWord.length - bWord.length;
    }

    return aWord.localeCompare(bWord);
  });

  display(list);
}

/* ===== ハイライト安全化 ===== */
function escapeRegExp(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function appendHighlightedText(element, text, query){
  if (!query) {
    element.textContent = text;
    return;
  }

  const matches = text.matchAll(new RegExp(escapeRegExp(query), "gi"));
  let offset = 0;
  for (const match of matches) {
    const mark = document.createElement("mark");
    mark.textContent = match[0];
    element.append(text.slice(offset, match.index), mark);
    offset = match.index + match[0].length;
  }
  element.append(text.slice(offset));
}

async function copyText(text, label){
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // ローカルファイルなど、Clipboard API が使えない環境向け
    const focused = document.activeElement;
    const field = document.createElement("textarea");
    field.className = "clipboard_field";
    field.value = text;
    field.readOnly = true;
    document.body.appendChild(field);
    field.select();
    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch {
      // ブラウザーがコピーを許可しない場合は失敗を表示
    } finally {
      field.remove();
      focused?.focus({preventScroll: true});
    }
    if (!copied) {
      if (label) showToast("コピーできませんでした");
      return;
    }
  }
  if (label) showToast(`${label}をコピーしました`);
}

function createCopyField(text, label, query){
  const button = document.createElement("button");
  button.type = "button";
  button.className = "copy_field";
  button.title = `${label}をコピー`;
  appendHighlightedText(button, text ?? "", query);
  button.disabled = !text;
  button.addEventListener("click", () => copyText(text, label));
  return button;
}

function renderCard(entry, isMy, saved = false){
  const {word, meaning, book} = entry;
  const query = isMy ? "" : keyword;
  const card = document.createElement("div");
  card.className = "card_item";

  const heading = document.createElement("div");
  heading.className = "card_item_word";
  heading.appendChild(createCopyField(word, "単語", query));
  if (saved) {
    const star = document.createElement("button");
    star.type = "button";
    star.className = "star";
    star.textContent = "★";
    star.setAttribute("aria-label", "保存単語から削除");
    star.addEventListener("click", () => removeItem(word, meaning, book));
    heading.appendChild(star);
  }

  const badge = document.createElement("div");
  badge.className = `card_item_book ${getBookClass(book)}`;
  badge.textContent = book;

  const definition = document.createElement("div");
  definition.className = "card_item_meaning";
  if (meaning) definition.appendChild(createCopyField(meaning, "意味", query));

  const button = document.createElement("button");
  button.type = "button";
  button.className = "card_item_button";
  button.textContent = isMy || saved ? "削除" : "保存";
  button.addEventListener("click", () => {
    if (isMy) removeItem(word, meaning, book);
    else toggleSave(word, meaning, book);
  });

  card.append(heading, badge, definition, button);
  return card;
}

function display(list){
  results.innerHTML = "";
  if (list.length === 0) {
    results.innerHTML = '<div class="empty">見つからん</div>';
    return;
  }

  const saved = readSaved();
  list.forEach(entry => {
    results.appendChild(renderCard(entry, false, saved.some(item => sameEntry(item, entry))));
  });
}

/* ===== マイ辞書 ===== */
function readSaved(){
  try {
    const entries = JSON.parse(localStorage.getItem("myDict"));
    return Array.isArray(entries) ? entries : [];
  } catch {
    return [];
  }
}

function sameEntry(a, b){
  return a && a.word === b.word && (a.meaning ?? "") === (b.meaning ?? "") && a.book === b.book;
}

function limitMessage(count){
  return count >= SAVE_LIMIT
    ? "保存上限に達しました。追加するには保存単語を削除してください。"
    : `保存上限まであと${SAVE_LIMIT - count}件です。`;
}

function loadMy(){
  const saved = readSaved();
  const progress = document.getElementById("savedProgress");
  progress.max = SAVE_LIMIT;
  progress.value = Math.min(saved.length, SAVE_LIMIT);
  progress.dataset.band = Math.floor(progress.value / 10);
  document.getElementById("savedCount").textContent = `保存単語 ${saved.length} / ${SAVE_LIMIT}件`;
  document.getElementById("savedWarning").textContent =
    saved.length >= SAVE_WARNING ? limitMessage(saved.length) : "";
  myResults.innerHTML = "";

  if (saved.length === 0) {
    myResults.innerHTML = '<div class="empty">なし</div>';
    return;
  }

  saved.forEach(entry => {
    if (entry && typeof entry.word === "string") myResults.appendChild(renderCard(entry, true));
  });
}

function writeSaved(entries){
  try {
    localStorage.setItem("myDict", JSON.stringify(entries));
    return true;
  } catch {
    showToast("保存内容を更新できませんでした");
    return false;
  }
}

function refreshSaved(){
  loadMy();
  runSearch();
}

function removeItem(word, meaning, book){
  const saved = readSaved().filter(entry => !sameEntry(entry, {word, meaning, book}));
  if (!writeSaved(saved)) return;
  refreshSaved();
  showToast("削除");
}

function toggleSave(word, meaning, book){
  const saved = readSaved();
  const entry = {word, meaning, book};
  if (saved.some(item => sameEntry(item, entry))) {
    removeItem(word, meaning, book);
    return;
  }
  if (saved.length >= SAVE_LIMIT) {
    showToast(limitMessage(saved.length));
    return;
  }

  saved.unshift(entry);
  if (!writeSaved(saved)) return;
  refreshSaved();
  showToast(saved.length >= SAVE_WARNING ? `追加しました。${limitMessage(saved.length)}` : "追加");
}

window.addEventListener("storage", event => {
  if (event.key === "myDict" || event.key === null) refreshSaved();
});

let toastTimer;
function showToast(msg){

  const t = document.getElementById("toast");

  if(!t) return;

  t.textContent = msg;

  t.classList.add("toast_show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("toast_show"), 2600);

}
function exportData(){
  const data = localStorage.getItem("myDict") || "[]";

  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "myDict.json";
  a.click();

  URL.revokeObjectURL(url);

  showToast("エクスポート完了");
}
function importData(){
  document.getElementById("fileInput").click();
}
function exportAnki(){
  const d = readSaved();

  if(d.length === 0){
    showToast("エクスポートする単語がありません");
    return;
  }

  // Anki用のCSVデータを作成
  let csvContent = "";
  d.forEach(x => {
    if (!x || typeof x.word !== "string") return;
    const word = `"${x.word.replace(/"/g, '""')}"`;
    const meaning = `"${(x.meaning ?? "").replace(/"/g, '""')}"`;
    csvContent += `${word},${meaning}\n`;
  });

  // UTF-8のBOM付きでBlobを作成してダウンロードを実行
  const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
  const blob = new Blob([bom, csvContent], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "anki_export.csv";
  a.click();

  URL.revokeObjectURL(url);

  // エクスポートが完了した後に削除の確認ダイアログを表示する
  if(window.confirm("エクスポートが完了しました。\n保存している単語を削除しますか？\nこの操作は取り消せません。")){
    // OKが押された場合：データを削除して画面を更新
    localStorage.removeItem("myDict");
    loadMy();
    runSearch();
    showToast("エクスポートと単語の削除が完了しました");
  } else {
    // キャンセルされた場合：削除せずにそのまま保持
    showToast("エクスポートが完了しました");
  }
}
document.getElementById("fileInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = "";

  const reader = new FileReader();

  reader.onload = function(){
    try{
      const imported = JSON.parse(reader.result);

      if (!Array.isArray(imported) || !imported.every(entry =>
        entry && typeof entry.word === "string" && entry.word.trim() &&
        typeof entry.book === "string" &&
        (entry.meaning == null || typeof entry.meaning === "string")
      )) {
        showToast("単語データの形式が正しくありません");
        return;
      }

      const saved = readSaved();
      const additions = [];
      for (const entry of imported) {
        if (saved.some(item => sameEntry(item, entry)) ||
            additions.some(item => sameEntry(item, entry))) continue;
        if (saved.length + additions.length >= SAVE_LIMIT) {
          showToast("50件を超えるためインポートできません");
          return;
        }
        additions.push(entry);
      }

      if (!additions.length) {
        showToast("追加する単語はありません");
        return;
      }

      const merged = [...saved, ...additions];
      if (!writeSaved(merged)) return;
      refreshSaved();
      showToast(merged.length >= SAVE_WARNING
        ? `${additions.length}件を追加しました。${limitMessage(merged.length)}`
        : `${additions.length}件をインポートしました`);
    }catch{
      showToast("読み込み失敗");
    }
  };

  reader.onerror = () => showToast("読み込み失敗");
  reader.readAsText(file);
});

/* ===== タブとスクロール位置の管理 ===== */
let searchScrollPos = 0;
let myScrollPos = 0;

function switchTab(isMy){
  // 今いるページのスクロール位置を保存しておく
  if(isMy){
    searchScrollPos = window.scrollY;
  } else {
    myScrollPos = window.scrollY;
  }

  // 画面（ページ）の切り替え
  document.getElementById("searchPage").classList.toggle("hidden", isMy);
  document.getElementById("myPage").classList.toggle("hidden", !isMy);

  document.getElementById("tabSearch").classList.toggle("tab_item_active", !isMy);
  document.getElementById("tabMy").classList.toggle("tab_item_active", isMy);

  if(isMy) loadMy();

  //  ちょっと遅らせてから、切り替え先のスクロール位置を復元する（描画が追いつくようにするため）
  setTimeout(() => {
    if(isMy){
      window.scrollTo(0, myScrollPos);
    } else {
      window.scrollTo(0, searchScrollPos);
    }
  }, 0);
}
/* ===== 初回の利用状況確認 ===== */
function showUsageCheck(){
  const dialog = document.getElementById("usageCheck");
  const link = document.getElementById("usageCheckLink");
  const storageKey = "wordSearchUsageCheck202611";
  if (typeof dialog.showModal !== "function") return;

  try {
    if (localStorage.getItem(storageKey) === "opened") return;
  } catch {
    return;
  }

  dialog.addEventListener("cancel", event => event.preventDefault());
  link.addEventListener("click", event => {
    try {
      localStorage.setItem(storageKey, "opened");
    } catch {
      // 記録できないときは、このページをそのまま使えるようにする。
      event.preventDefault();
    }
    dialog.close();
  });
  dialog.showModal();
}
